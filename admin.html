<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel | Raftaroo</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#00C853;--primary-dark:#00A040;--primary-light:#E8F5E9;--secondary:#0A0F1E;--bg:#F0F4F8;--white:#fff;--text:#0A0F1E;--muted:#64748B;--border:rgba(0,0,0,.08);--error:#EF4444;--warning:#F59E0B;--shadow:0 4px 20px rgba(0,0,0,.10);}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none!important;}
header{background:var(--secondary);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
.logo{width:34px;height:34px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.btn-logout{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;}
.wrap{max-width:560px;margin:0 auto;padding:20px;}
.card{background:var(--white);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px;}
h2{font-size:18px;margin-bottom:6px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;}
input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;outline:none;}
input:focus{border-color:var(--primary);}
.btn-google{width:100%;margin-top:6px;background:#fff;color:var(--text);border:1.5px solid var(--border);padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google i{color:#DB4437;font-size:18px;}
.btn-google:disabled{opacity:.6;}
.btn-main{width:100%;margin-top:18px;background:var(--primary);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;}
.err{color:var(--error);font-size:13px;font-weight:600;margin-top:12px;min-height:18px;}
/* status */
.status{border-radius:16px;padding:20px;text-align:center;margin-bottom:18px;transition:.25s;}
.status.free{background:var(--primary-light);border:2px solid var(--primary);}
.status.paid{background:#FEF3C7;border:2px solid var(--warning);}
.status.load{background:#F1F5F9;border:2px solid #CBD5E1;}
.status .ico{font-size:34px;margin-bottom:8px;}
.status.free .ico{color:var(--primary-dark);}
.status.paid .ico{color:#B45309;}
.status .t{font-size:20px;font-weight:800;}
.status .d{font-size:13px;color:var(--muted);margin-top:4px;}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sw{border:2px solid var(--border);background:#fff;border-radius:14px;padding:16px 10px;font-weight:800;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;color:var(--text);}
.sw i{font-size:22px;}
.sw small{font-weight:600;font-size:11px;color:var(--muted);}
.sw.free{border-color:var(--primary);color:var(--primary-dark);}
.sw.paid{border-color:var(--warning);color:#B45309;}
.sw.active{color:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2);}
.sw.active small{color:rgba(255,255,255,.85);}
.sw.free.active{background:var(--primary);}
.sw.paid.active{background:var(--warning);}
.sw:disabled{opacity:.6;cursor:not-allowed;}
.meta{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--secondary);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:99;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="wrap" style="padding-top:60px;">
    <div class="card">
        <div class="brand" style="color:var(--text);margin-bottom:14px;"><div class="logo"><i class="fas fa-shield-halved" style="color:#fff"></i></div> Raftaroo Admin</div>
        <h2>Admin Login</h2>
        <p class="sub">Sirf admin Google account se login hoga.</p>
        <button class="btn-google" id="loginBtn"><i class="fab fa-google"></i> Google se Login karein</button>
        <div class="err" id="loginErr"></div>
    </div>
</div>

<!-- PANEL -->
<div id="panelView" class="hidden">
    <header>
        <div class="brand"><div class="logo"><i class="fas fa-shield-halved"></i></div> Admin Panel</div>
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</button>
    </header>
    <div class="wrap">
        <div class="card">
            <h2><i class="fas fa-percent" style="color:var(--primary)"></i> Commission Control</h2>
            <p class="sub">Ek click mein poori app commission free ya commission wali kar dein. Change foran saare captains par lag jata hai.</p>

            <div class="status load" id="statusBox">
                <div class="ico"><i class="fas fa-spinner fa-spin"></i></div>
                <div class="t" id="statusTitle">Loading...</div>
                <div class="d" id="statusDesc"></div>
            </div>

            <div class="btns">
                <button class="sw free" id="btnFree"><i class="fas fa-gift"></i>Commission Free<small>0% — poori kamayi captain ki</small></button>
                <button class="sw paid" id="btnPaid"><i class="fas fa-coins"></i>With Commission<small>10% per ride</small></button>
            </div>
            <div class="meta" id="metaText"></div>
        </div>
    </div>
</div>

<div class="toast hidden" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBBS7jGzuVlTIIeN9VFBxpwHkNf-mIRzDo",
    authDomain: "raftaroo-9ce8d.firebaseapp.com",
    databaseURL: "https://raftaroo-9ce8d-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "raftaroo-9ce8d",
    storageBucket: "raftaroo-9ce8d.firebasestorage.app",
    messagingSenderId: "773738074182",
    appId: "1:773738074182:web:b7a873959c7ab8edc0ba47",
    measurementId: "G-EM1R4LGZTD"
};
const ADMIN_UID = "NaTu8bPLebTvSKuJn64oOGmZDkH3";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const $ = (id) => document.getElementById(id);

let unsub = null;
let currentFree = null;

function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2600);
}

// ─── AUTH ───
$('loginBtn').onclick = async () => {
    $('loginErr').textContent = '';
    $('loginBtn').disabled = true;
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) {
        if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request')
            $('loginErr').textContent = 'Google login fail: ' + (e.code || e.message);
    }
    $('loginBtn').disabled = false;
};
$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { $('panelView').classList.add('hidden'); $('loginView').classList.remove('hidden'); return; }
    if (user.uid !== ADMIN_UID) {
        await signOut(auth);
        $('loginErr').textContent = 'Yeh account admin nahi hai.';
        return;
    }
    $('loginView').classList.add('hidden');
    $('panelView').classList.remove('hidden');
    unsub = onValue(ref(db, 'settings'), (snap) => {
        const v = snap.val() || {};
        render(v.commissionFree === true, v.commissionUpdatedAt);
    }, () => toast('Settings load nahi hui — database rules check karein.'));
});

// ─── UI ───
function render(isFree, ts) {
    currentFree = isFree;
    const box = $('statusBox');
    box.className = 'status ' + (isFree ? 'free' : 'paid');
    box.querySelector('.ico').innerHTML = isFree ? '<i class="fas fa-circle-check"></i>' : '<i class="fas fa-coins"></i>';
    $('statusTitle').textContent = isFree ? 'App COMMISSION FREE hai' : 'Commission ON hai (10%)';
    $('statusDesc').textContent = isFree
        ? 'Captains se koi commission nahi kat raha, wallet balance bhi zaroori nahi.'
        : 'Har completed ride par 10% commission wallet se kat raha hai.';
    $('btnFree').classList.toggle('active', isFree);
    $('btnPaid').classList.toggle('active', !isFree);
    $('metaText').textContent = ts ? 'Aakhri change: ' + new Date(ts).toLocaleString() : '';
}

async function setCommission(free) {
    if (currentFree === free) { toast('Yeh option pehle se active hai'); return; }
    const msg = free
        ? 'Poori app COMMISSION FREE kar dein?\nAbhi se har ride par 0% commission hoga.'
        : 'Commission dobara ON kar dein?\nHar ride par 10% commission katega.';
    if (!confirm(msg)) return;
    $('btnFree').disabled = $('btnPaid').disabled = true;
    try {
        await update(ref(db, 'settings'), {
            commissionFree: free,
            commissionUpdatedAt: Date.now(),
            commissionUpdatedBy: ADMIN_UID
        });
        toast(free ? '🎉 App ab Commission Free hai' : '✅ Commission ON kar diya');
    } catch (e) {
        toast('Save nahi hua: ' + e.message);
    }
    $('btnFree').disabled = $('btnPaid').disabled = false;
}
$('btnFree').onclick = () => setCommission(true);
$('btnPaid').onclick = () => setCommission(false);
</script>
</body>
</html>
